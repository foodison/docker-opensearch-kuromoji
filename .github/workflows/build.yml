name: Build and push Docker image

on:
  workflow_dispatch:
    inputs:
      opensearch_version:
        description: 'OpenSearch version'
        required: true

env:
  ECR_REGISTRY: foodison
  ECR_REPOSITORY: opensearch-kuromoji
  GHCR_IMAGE: ghcr.io/foodison/opensearch-kuromoji

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build Docker image and push to AWS ECR and GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Login to Public ECR
      uses: docker/login-action@v2
      with:
        registry: public.ecr.aws
        username: ${{ secrets.AWS_ACCESS_KEY_ID }}
        password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: |
          public.ecr.aws/${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.opensearch_version }}
          ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.opensearch_version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: OPENSEARCH_VERSION=${{ github.event.inputs.opensearch_version }}
